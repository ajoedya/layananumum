<style>/* Tirai piksel sesudah pindah dari atau ke mode arkade; dibuka skrip halaman, dengan batas waktu sebagai pengaman. */html.tirai::after { content: ""; position: fixed; inset: 0; z-index: 2147483646; background: #efe6d2; } html.tirai[data-mode="gelap"]::after { background: #0a1420; }</style>

<style>
:root {
  --pindai: rgba(0,0,0,.14);
  --latar: #0a1420; --layar: #0f2236; --layar-2: #13304b; --tinta: #e8f1f8; --redup: #9fc3e0; --emas: #ffd27a; --emas-tua: #f2b44a; --emas-gelap: #b8700f;
  --hijau: #6be3a4; --garis: #e8f1f8; --bayang: #f2b44a; --di-aksen: #0a1420; --sorot: #ffe3a3; --px: "Pixelify Sans", "Public Sans", monospace;
}
/* Mode terang mengikuti saklar tema situs (tema.js): krem dengan garis navy. Banner tetap adegan malam. */
:root:not([data-mode="gelap"]) {
  --latar: #efe6d2; --layar: #fbf5e8; --layar-2: #f1e5c8; --tinta: #0f2236; --redup: #4f6478; --emas: #8a5208; --emas-tua: #f2b44a; --emas-gelap: #f2d49a;
  --hijau: #1f7a4c; --garis: #0f2236; --bayang: #0f3554; --di-aksen: #0a1420; --sorot: #fff1cc; --pindai: rgba(15,34,54,.035);
}
:root:not([data-mode="gelap"]) .judul-px { color: #b8700f; text-shadow: 3px 3px 0 #f2d49a, 6px 6px 0 rgba(15,34,54,.18); }
:root:not([data-mode="gelap"]) .bagian-kepala h2, :root:not([data-mode="gelap"]) .jendela > h2 { color: #8a5208; }
:root:not([data-mode="gelap"]) .jendela { box-shadow: inset 0 0 0 3px var(--layar), inset 0 0 0 5px #b9a47a; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--latar); color: var(--tinta); font: 15px/1.5 "Public Sans", system-ui, sans-serif; padding-bottom: 40px; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--emas); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.px { font-family: var(--px); }
svg.sprite { width: 36px; height: 36px; shape-rendering: crispEdges; flex: none; }
svg.mini { shape-rendering: crispEdges; display: block; }

.kabinet { max-width: 1080px; margin: 0 auto; padding: 18px 18px 0; }
.layar { position: relative; border: 4px solid var(--garis); box-shadow: 8px 8px 0 var(--bayang); background: var(--layar); }
.layar::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, var(--pindai) 0 1px, transparent 1px 3px); z-index: 3; }

/* ---------- Bagian bersama ---------- */
.hud { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 10px 16px; background: var(--layar); border-bottom: 4px solid var(--garis); font: 16px/1.2 var(--px); letter-spacing: .06em; }
.hud b { color: var(--emas); font-weight: 600; }
.hud .tengah { text-align: center; }
.hud .kanan { display: flex; justify-content: flex-end; gap: 8px; }
.tombol-px { min-height: 40px; min-width: 40px; padding: 4px 10px; border: 3px solid var(--garis); background: var(--layar); font: 15px/1 var(--px); letter-spacing: .06em; cursor: pointer; box-shadow: 3px 3px 0 var(--bayang); }
.tombol-px:hover { background: var(--layar-2); }
.tombol-px:active { transform: translate(3px, 3px); box-shadow: none; }
.tombol-px[aria-pressed="true"] { background: var(--emas-tua); color: var(--di-aksen); }

.banner { position: relative; border: 4px solid var(--garis); background: var(--latar); aspect-ratio: 16 / 9; overflow: hidden; }
.banner canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.banner .stiker { position: absolute; left: 10px; top: 10px; padding: 4px 8px; background: var(--emas-tua); color: var(--di-aksen); font: 14px/1.2 var(--px); letter-spacing: .06em; }
.gelembung { position: absolute; left: 47%; top: 10%; padding: 6px 10px; background: #e8f1f8; color: #0a1420; font: 700 clamp(13px, 2vw, 20px)/1 var(--px); letter-spacing: .06em;
  box-shadow: 0 -3px 0 var(--di-aksen), 0 3px 0 var(--di-aksen), -3px 0 0 var(--di-aksen), 3px 0 0 var(--di-aksen); animation: muncul 3.2s steps(1) infinite; }
.gelembung::after { content: ""; position: absolute; left: 8px; top: 100%; width: 8px; height: 8px; background: #e8f1f8; box-shadow: -3px 0 0 var(--di-aksen), 3px 0 0 var(--di-aksen), 0 3px 0 var(--di-aksen); }
@keyframes muncul { 0%, 62% { opacity: 1; } 63%, 100% { opacity: 0; } }

.judul-px { margin: 0; font: 700 clamp(40px, 7vw, 76px)/.92 var(--px); letter-spacing: .02em; color: var(--emas); text-shadow: 4px 4px 0 var(--emas-gelap), 8px 8px 0 var(--latar); }
.sub-px { margin: 12px 0 0; font: 18px/1.35 var(--px); color: var(--redup); }
.kedip { animation: kedip 1.1s steps(2, start) infinite; }
@keyframes kedip { to { visibility: hidden; } }

.bagian { padding: 20px 22px 24px; border-top: 4px solid var(--garis); }
.bagian-kepala { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; }
.bagian-kepala h2 { margin: 0; font: 600 24px/1.1 var(--px); letter-spacing: .08em; color: var(--emas); }
.bagian-kepala p { margin: 0; font: 15px/1.3 var(--px); color: var(--redup); }

.cari-px { display: flex; align-items: center; gap: 10px; border: 3px solid var(--garis); background: var(--latar); padding: 4px 12px; margin-bottom: 14px; }
.cari-px label { font: 17px/1 var(--px); color: var(--emas); white-space: nowrap; letter-spacing: .06em; }
.cari-px input { flex: 1; min-width: 0; height: 42px; border: 0; background: none; color: var(--tinta); font: 20px/1 var(--px); outline: none; }
.cari-px input::placeholder { color: var(--redup); opacity: .8; }
.cari-px kbd { font: 14px/1 var(--px); padding: 4px 7px; border: 2px solid var(--redup); color: var(--redup); }
.kosong-px { padding: 24px 14px; text-align: center; font: 18px/1.4 var(--px); color: var(--redup); list-style: none; }
.lencana { font: 14px/1 var(--px); padding: 5px 8px; border: 2px solid currentColor; color: var(--hijau); white-space: nowrap; letter-spacing: .06em; }
.lencana.luar { color: var(--emas); }
.lencana.arsip { color: var(--redup); }

/* Daftar gaya baris */
.level { list-style: none; margin: 0; padding: 0; border: 3px solid var(--garis); }
.level li + li { border-top: 2px dashed rgba(232,241,248,.35); }
.lv { display: grid; grid-template-columns: 22px 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 14px; min-height: 64px; }
.lv .kur { color: var(--emas); visibility: hidden; font: 18px var(--px); }
.sprite-wadah { width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid var(--garis); background: var(--latar); flex: none; }
.lv b { display: block; font: 600 20px/1.15 var(--px); letter-spacing: .02em; }
.lv small { display: block; margin-top: 2px; font-size: 14px; color: var(--redup); }
.lv.pilih, .lv:hover { background: var(--emas-tua); color: var(--di-aksen); }
.lv.pilih .kur, .lv:hover .kur { visibility: visible; color: var(--di-aksen); }
.lv.pilih small, .lv:hover small, .lv.pilih .lencana, .lv:hover .lencana { color: var(--di-aksen); }
.lv.pilih .sprite-wadah, .lv:hover .sprite-wadah { border-color: var(--di-aksen); background: var(--sorot); }

/* Dialog kabar dengan potret beruang */
.dialog-wadah { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 14px; align-items: stretch; }
.potret { border: 3px solid var(--garis); background: var(--layar-2); display: grid; place-items: center; }
.potret svg { width: 72px; height: 72px; }
.dialog { position: relative; min-height: 116px; padding: 12px 16px 32px; border: 3px solid var(--garis); background: var(--latar); box-shadow: inset 0 0 0 3px var(--layar), inset 0 0 0 5px var(--garis); }
.dialog .siapa { font: 15px/1 var(--px); color: var(--emas); letter-spacing: .08em; }
.dialog h3 { margin: 8px 0 4px; font: 600 19px/1.2 var(--px); }
.dialog p { margin: 0; font-size: 15px; }
.dialog button { position: absolute; right: 10px; bottom: 6px; min-height: 32px; border: 0; background: none; font: 15px/1 var(--px); color: var(--emas); cursor: pointer; letter-spacing: .06em; }
.dialog button span { display: inline-block; animation: turun .8s steps(2) infinite; }
@keyframes turun { 50% { transform: translateY(3px); } }

.kaki-px { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 18px; padding: 14px 22px 16px; border-top: 4px solid var(--garis); font: 14px/1.4 var(--px); color: var(--redup); letter-spacing: .04em; }
.kontrol { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.kontrol kbd { display: inline-block; min-width: 24px; padding: 2px 6px; margin-right: 4px; background: var(--tinta); color: var(--latar); font: 13px/1.4 var(--px); text-align: center; }

/* ---------- C. Jendela RPG ---------- */
.c-atas { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; padding: 18px; }
.jendela { position: relative; border: 3px solid var(--garis); background: linear-gradient(var(--layar-2), var(--layar)); box-shadow: inset 0 0 0 3px var(--latar), inset 0 0 0 5px var(--redup); padding: 16px 18px; border-radius: 6px; }
.jendela > h2 { position: absolute; top: -13px; left: 14px; margin: 0; padding: 2px 8px; background: var(--latar); border: 2px solid var(--garis); font: 600 15px/1.1 var(--px); letter-spacing: .1em; color: var(--emas); }
.c-atas .banner { border-radius: 6px; }
.status .judul-px { font-size: clamp(30px, 4vw, 46px); text-shadow: 3px 3px 0 var(--emas-gelap); }
.status dl { margin: 16px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font: 16px/1.2 var(--px); letter-spacing: .04em; }
.status dt { color: var(--redup); }
.status dd { margin: 0; color: var(--tinta); }
.bar { display: inline-block; vertical-align: middle; width: 120px; height: 12px; border: 2px solid var(--garis); background: var(--latar); }
.bar i { display: block; width: 92%; height: 100%; background: repeating-linear-gradient(90deg, var(--hijau) 0 8px, #3fbf80 8px 10px); }
.c-tengah > *, .c-atas > * { min-width: 0; }
.c-tengah { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 4px 18px 18px; align-items: start; }
.perintah { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.perintah button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 42px; padding: 4px 6px; border: 0; background: none; text-align: left; cursor: pointer; font: 18px/1.1 var(--px); letter-spacing: .04em; }
.perintah .kur { width: 14px; color: var(--emas); visibility: hidden; }
.perintah button[aria-pressed="true"] { color: var(--emas); }
.perintah button[aria-pressed="true"] .kur, .perintah button:hover .kur { visibility: visible; }
.perintah small { margin-left: auto; color: var(--redup); font-size: 14px; }
.c-tengah .level { border: 0; }
.c-tengah .level li + li { border-top: 2px dotted rgba(232,241,248,.25); }
.c-tengah .lv { border-radius: 4px; }
.c-bawah { padding: 4px 18px 22px; }
.c-bawah .dialog-wadah { grid-template-columns: 120px minmax(0, 1fr); }
.c-bawah .potret, .c-bawah .dialog { border-radius: 6px; }

@media (max-width: 760px) {
  .kabinet { padding: 10px 10px 0; }
  .layar { box-shadow: 5px 5px 0 var(--bayang); }
  .hud { grid-template-columns: 1fr auto; font-size: 14px; padding: 8px 10px; }
  .hud .tengah { display: none; }
  .bagian { padding: 16px 14px 18px; }
  .lv { grid-template-columns: 16px 40px minmax(0, 1fr); gap: 10px; padding: 10px; }
  .lv .lencana { display: none; }
  .dialog-wadah, .c-bawah .dialog-wadah { grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: start; }
  .potret { aspect-ratio: 1; }
  .potret svg { width: 44px; height: 44px; }
  .kontrol { display: none; }
  .c-atas, .c-tengah { grid-template-columns: 1fr; padding: 14px; gap: 18px; }
  .perintah { flex-direction: row; overflow-x: auto; gap: 6px; }
  .perintah button { white-space: nowrap; border: 2px solid var(--garis); padding: 4px 10px; }
  .perintah small { display: none; }
  .c-bawah { padding: 4px 14px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .kedip, .dialog button span, .gelembung { animation: none; }
  .tombol-px:active { transform: none; }
}
</style>
</head>
