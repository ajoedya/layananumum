<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com https://drive.google.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Layanan Subbagian Umum KPKNL Balikpapan: perjalanan dinas, keuangan, dan perkakas kerja dalam satu halaman.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<script src="tema.js"></script>
<script src="konten.js"></script>
<style>html, body { margin: 0; padding: 0; } img { max-width: 100%; } [hidden] { display: none !important; }</style>
<title>Layanan Subbagian Umum | KPKNL Balikpapan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Tata letak: panel samping biru laut (merek, judul, menu kelompok, foto banner yang berganti)
   dan kolom isi berupa baris layanan bernomor per kelompok. Satu tampilan terang.
   Semua warna lewat variabel di bawah. Isi beranda (teks, tautan, informasi, banner) diatur dari dasbor admin (admin/) dan cadangannya ada di konten.js. */
:root {
  color-scheme: light;
  --huruf: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --laut-tua: #0f3554;
  --laut-hover: #1b4d75;
  --emas-tua: #b8700f;
  --emas-teks: #8a5208;
  --emas-muda: #fff6e1;
  --emas-garis: #e9d3a0;
  --emas-terang: #ffd27a;
  --putih: #ffffff;
  --latar: #f5f8fa;
  --tinta-lembut: #4f6577;
  --garis: #e2e9ec;
  --cari-garis: #cdd9e0;
  --tombol-polos: #fbfdfd;
  --baris-hover: #fff8e6;
  --tautan: #0f4a78;
  --teks-contoh: #677d8e;
  --arsip-teks: #45596b;
  --panel-teks: #dbe6ee;
  --panel-kecil: #c9d8e4;
  --bayang-teks: #0a2338;
  --rgb-laut: 15, 53, 84;
  --rgb-gelap: 10, 40, 66;
  --tepi: clamp(18px, 4vw, 56px);
}
/* ---------- Mode gelap ----------
   Dipasang lewat data-mode="gelap" pada <html> oleh tema.js (mengikuti perangkat, bisa diubah lewat saklar tema).
   --laut-tua dipakai sebagai warna teks, jadi di mode gelap ia menjadi terang; panel samping memakai --rgb-laut. */
:root[data-mode="gelap"] {
  color-scheme: dark;
  --latar: #0e1620; --putih: #16212c; --laut-tua: #e4ecf2; --laut-hover: #2a5f8c;
  --tinta-lembut: #a3b3c0; --garis: #243341; --cari-garis: #314353; --tombol-polos: #16212c;
  --baris-hover: #1c2935; --tautan: #8cc3f0; --teks-contoh: #7f92a1; --arsip-teks: #9aabb8;
  --emas-teks: #f0b860; --emas-tua: #e0a040; --emas-muda: #241d13; --emas-garis: #5a4626;
  --panel-teks: #c9d6e0; --rgb-laut: 11, 32, 51; --rgb-gelap: 5, 16, 27;
  --hijau-teks: #8fd9ae; --hijau-latar: #12301f; --hijau-garis: #2b5a3f;
  --biru-teks: #9cc6f0;  --biru-latar: #132a42;  --biru-garis: #2c4c6e;
  --merah-teks: #f2a89d; --merah-latar: #3a1915; --merah-garis: #6a3229;
  --abu-teks: #b0bcc5;   --abu-latar: #1f2b36;   --abu-garis: #344452;
}
:root[data-mode="gelap"] .panel { background: rgb(var(--rgb-laut)); color: #fff; }
:root[data-mode="gelap"] .merek, :root[data-mode="gelap"] .kelompok a { color: #fff; }
:root[data-mode="gelap"] .baris.sorot { background: #2a2216; }
:root[data-mode="gelap"] .kerangka { background: linear-gradient(90deg, #1a2531 25%, #223040 50%, #1a2531 75%); background-size: 200% 100%; }

/* ---------- Saklar tema ----------
   Tombol bulat ikon saja, sama dengan Bengkel PDF. Ikon bulan di mode terang, matahari di mode gelap. */
.saklar-tema {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0;
  color: var(--laut-tua); background: var(--tombol-polos); border: 1px solid var(--emas-garis); border-radius: 50%;
  cursor: pointer; transition: background-color .16s ease, border-color .16s ease;
}
.saklar-tema:hover { background: var(--emas-muda); border-color: var(--emas-tua); }
.saklar-tema:focus-visible { outline: 3px solid var(--emas-tua); outline-offset: 3px; }
.saklar-tema svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.saklar-tema .ikon-matahari { display: none; }
:root[data-mode="gelap"] .saklar-tema .ikon-bulan { display: none; }
:root[data-mode="gelap"] .saklar-tema .ikon-matahari { display: block; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--latar); color: var(--laut-tua);
  font-family: var(--huruf); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
i { font-style: italic; }
.sr-only {
  position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important;
  margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important;
  white-space: nowrap !important; border: 0 !important;
}
.halaman { display: flex; flex-wrap: wrap; align-items: stretch; }

/* ---------- Panel samping ---------- */
/* .panel hanya wadah (dan wadah gulir di layar lebar). Tata letak serta foto ada di .panel-dalam, yang minimal setinggi panel
   dan ikut memanjang bila isinya lebih panjang, jadi foto selalu menempel sampai dasar isi, tidak terpotong saat panel digulir. */
.panel { flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; background: var(--laut-tua); color: var(--putih); }
.panel-dalam {
  flex: 1 0 auto; min-height: 100%; position: relative; isolation: isolate; overflow: hidden;
  padding: 28px 36px 30px; display: flex; flex-direction: column; gap: 18px;
}
.panel-foto, .panel-tabir { position: absolute; left: 0; right: 0; bottom: 0; }
/* Panel terbagi kira-kira separuh teks dan separuh foto. Tabir sedikit lebih tinggi daripada foto,
   supaya tepi atas foto tertutup penuh sebelum peralihannya dimulai. */
.panel-foto { height: 58%; }
.panel-tabir { height: 64%; }
.panel-foto {
  z-index: -2; background: url("banner-balikpapan.jpg") 72% center / cover no-repeat;
  transition: opacity .5s ease;
}
.panel-foto.memudar { opacity: 0; }
.panel-tabir {
  z-index: -1;
  /* Peralihan panel ke foto memakai kurva halus (banyak titik henti), bukan garis lurus, supaya tidak tampak sebagai pita.
     Lapisan pertama menggelapkan dasar foto untuk keterangan. */
  background:
    linear-gradient(to bottom, rgba(var(--rgb-gelap),0) 58%, rgba(var(--rgb-gelap),.55) 80%, rgba(var(--rgb-gelap),.88) 100%),
    linear-gradient(to bottom,
      rgb(var(--rgb-laut)) 7%, rgba(var(--rgb-laut),.998) 9.3%, rgba(var(--rgb-laut),.984) 11.6%,
      rgba(var(--rgb-laut),.951) 13.9%, rgba(var(--rgb-laut),.896) 16.2%, rgba(var(--rgb-laut),.820) 18.6%,
      rgba(var(--rgb-laut),.725) 20.9%, rgba(var(--rgb-laut),.616) 23.2%, rgba(var(--rgb-laut),.500) 25.5%,
      rgba(var(--rgb-laut),.384) 27.8%, rgba(var(--rgb-laut),.275) 30.1%, rgba(var(--rgb-laut),.180) 32.4%,
      rgba(var(--rgb-laut),.104) 34.8%, rgba(var(--rgb-laut),.049) 37.1%, rgba(var(--rgb-laut),.016) 39.4%,
      rgba(var(--rgb-laut),.002) 41.7%, rgba(var(--rgb-laut),0) 44%);
}
.panel-keterangan { padding-top: 40px; }
@media (min-width: 921px) {
  /* Panel menempel di layar lebar, jadi menu kelompok tetap terlihat saat kolom isi digulir. */
  .panel { position: sticky; top: 0; align-self: flex-start; height: 100vh; height: 100dvh; overflow-y: auto; }
}
.merek { color: var(--putih); font: 800 21px/1.1 var(--huruf); letter-spacing: -.02em; text-decoration: none; align-self: flex-start; }
.merek small { display: block; margin-top: 4px; color: var(--panel-kecil); font: 600 11px/1.4 var(--huruf); letter-spacing: .18em; }
.panel-judul { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
.label { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .15em; line-height: 1.55; text-transform: uppercase; }
.panel .label { color: var(--emas-terang); }
h1 { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.1; letter-spacing: -.025em; text-wrap: balance; }
h1 span { display: block; margin-top: 8px; color: var(--emas-terang); font-size: 22px; line-height: 1.25; letter-spacing: -.02em; }
h1 .judul-utama { display: inline; margin: 0; color: inherit; font-size: inherit; line-height: inherit; letter-spacing: inherit; }
.daftar-bagian { display: flex; flex-direction: column; gap: 22px; }
.daftar-bagian:empty { display: none; }
.pratinjau { margin: 0; padding: 10px 16px; border: 1px dashed var(--emas-tua); border-radius: 6px; background: var(--emas-muda); color: var(--emas-teks); font-size: 14px; font-weight: 700; }
.panel-deskripsi { margin: 0; color: var(--panel-teks); font-size: 15px; line-height: 1.6; }
/* Tiap menu kelompok berupa kotak kaca: latar navy tembus pandang yang mengaburkan foto di belakangnya,
   dengan garis tepi terang yang jelas, jadi teks putih tetap kontras di atas bagian foto yang terang sekalipun. */
.kelompok { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 0; }
.kelompok a {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px;
  padding: 8px 12px 8px 16px; border-radius: 12px; color: var(--putih); font-size: 15px; font-weight: 600; text-decoration: none;
  background: rgba(var(--rgb-laut),.62); border: 1px solid rgba(255,255,255,.30);
  box-shadow: 0 4px 16px rgba(var(--rgb-gelap),.28), inset 0 1px 0 rgba(255,255,255,.12);
  -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2);
  text-shadow: 0 1px 2px rgba(var(--rgb-gelap),.5);
  transition: background-color .16s ease, border-color .16s ease;
}
.kelompok a:hover { background: rgba(var(--rgb-laut),.78); border-color: rgba(255,255,255,.5); }
.kelompok a[aria-current="true"] { background: rgba(var(--rgb-laut),.82); border-color: var(--emas-terang); box-shadow: 0 4px 16px rgba(var(--rgb-gelap),.32), inset 3px 0 0 var(--emas-terang); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .kelompok a { background: rgba(var(--rgb-laut),.88); }
}
.kelompok a[aria-current="true"] b { background: var(--emas-terang); color: #0f3554; }
.kelompok b {
  min-width: 26px; padding: 2px 8px; border-radius: 12px; background: rgba(var(--rgb-gelap),.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
  font-size: 12px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums;
}
.panel-keterangan {
  margin: auto 0 0; display: grid; gap: 4px; font-size: 14px; line-height: 1.4;
  text-shadow: 0 1px 10px var(--bayang-teks), 0 1px 3px var(--bayang-teks), 0 0 2px var(--bayang-teks);
}
.panel-keterangan span:first-child { font-size: 12px; font-weight: 700; letter-spacing: .18em; }
.panel-keterangan u { display: inline-block; background: var(--emas-terang); width: 37px; height: 2px; margin-left: 8px; vertical-align: middle; }
.merek:focus-visible, .kelompok a:focus-visible { outline: 3px solid var(--emas-terang); outline-offset: 3px; }

/* ---------- Kolom isi ---------- */
.isi { flex: 999 1 560px; min-width: 0; padding: 32px var(--tepi) 26px; display: flex; flex-direction: column; gap: 22px; }
.alat { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.cari { flex: 1 1 320px; min-width: 0; display: flex; overflow: hidden; margin: 0; background: var(--putih); border: 1px solid var(--cari-garis); border-radius: 6px; }
.cari:focus-within { outline: 3px solid var(--emas-garis); outline-offset: 1px; }
#cariLayanan {
  flex: 1 1 auto; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent;
  color: var(--laut-tua); font: 400 16px var(--huruf); min-height: 48px; padding: 10px 12px;
}
#cariLayanan::placeholder { color: var(--teks-contoh); opacity: 1; }
.cari-ikon { flex: none; width: 20px; height: 20px; margin: 14px 0 0 16px; color: var(--teks-contoh); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
#cariLayanan::-webkit-search-cancel-button { -webkit-appearance: none; }
.cari .hapus {
  flex: none; width: 48px; min-height: 48px; padding: 0; border: 0; background: transparent; color: var(--tinta-lembut);
  display: grid; place-items: center; cursor: pointer;
}
.cari .hapus:hover { color: var(--laut-tua); background: var(--emas-muda); }
.cari .hapus:focus-visible { outline: 3px solid var(--emas-tua); outline-offset: -3px; }
.cari .hapus svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.gerbang {
  flex: none; display: inline-flex; align-items: center; min-height: 48px; padding: 10px 18px;
  background: var(--tombol-polos); border: 1px solid var(--emas-garis); border-radius: 6px;
  color: var(--laut-tua); font-size: 15px; font-weight: 600; text-decoration: none;
}
.gerbang:hover { border-color: var(--emas-tua); background: var(--emas-muda); }
.gerbang:focus-visible { outline: 3px solid var(--emas-tua); outline-offset: 3px; }
/* ---------- Kotak informasi bergeser ----------
   Tiap informasi satu <article class="info">. Bila isinya lebih dari satu, kotak bergeser dari bawah ke atas
   tiap beberapa detik (atur di DETIK_PER_INFO pada skrip). Semua informasi dibuat setinggi informasi terpanjang. */
.kabar { position: relative; background: var(--emas-muda); border-left: 3px solid var(--emas-tua); border-radius: 4px; }
.kabar-jendela { position: relative; overflow: hidden; }
.kabar-jalur { display: flex; flex-direction: column; transition: transform .6s cubic-bezier(.22,.61,.36,1); }
.info { padding: 14px 22px 16px 24px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.info p { margin: 0; }
.info .label { color: var(--emas-teks); letter-spacing: .13em; text-transform: none; }
.kabar.bergeser .info .label { min-height: 44px; display: flex; align-items: center; padding-right: 220px; }
.info strong { font-size: 17px; font-weight: 700; line-height: 1.3; }
.info p:last-child { color: var(--tinta-lembut); font-size: 14px; line-height: 1.55; }
.kabar-kendali { position: absolute; top: 6px; right: 8px; display: flex; align-items: center; gap: 2px; }
.titik { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer; }
.titik::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--emas-garis); transition: background-color .2s ease, transform .2s ease; }
.titik:hover::before { background: var(--emas-tua); }
.titik[aria-current="true"]::before { background: var(--emas-tua); transform: scale(1.3); }
.jeda {
  margin-left: 4px; min-width: 64px; height: 44px; padding: 0 14px; border: 1px solid var(--emas-garis); border-radius: 22px;
  background: var(--putih); color: var(--emas-teks); font: 700 12px var(--huruf); cursor: pointer;
}
.jeda:hover { border-color: var(--emas-tua); }
.titik:focus-visible, .jeda:focus-visible { outline: 3px solid var(--emas-tua); outline-offset: 1px; }
.bagian { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 16px; }
.bagian h2 { margin: 0; color: var(--emas-teks); font-size: 12px; font-weight: 700; letter-spacing: .15em; line-height: 1.55; text-transform: uppercase; }
.bagian.arsip h2, .bagian.arsip .nomor { color: var(--arsip-teks); }
.daftar { background: var(--putih); border: 1px solid var(--garis); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 6px rgba(var(--rgb-laut),.04); }
.baris {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 14px; align-items: center;
  padding: 13px 20px; border-top: 1px solid var(--garis); color: var(--laut-tua); text-decoration: none;
  transition: background-color .16s ease;
}
.baris.pertama { border-top: 0; }
.baris:hover { background: var(--baris-hover); }
.baris:focus-visible { outline: 3px solid var(--emas-tua); outline-offset: -3px; }
.nomor { color: var(--emas-teks); font-size: 14px; font-weight: 700; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.uraian { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.uraian strong { font-size: 16px; font-weight: 700; line-height: 1.3; letter-spacing: -.015em; }
.uraian span { color: var(--tinta-lembut); font-size: 14px; line-height: 1.5; }
.buka { color: var(--tautan); font-size: 14px; font-weight: 700; white-space: nowrap; }
.kosong { margin: 0; background: var(--emas-muda); border-left: 3px solid var(--emas-tua); border-radius: 4px; padding: 16px 22px; color: var(--tinta-lembut); }
.kaki { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--garis); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px 20px; color: var(--tinta-lembut); font-size: 14px; }
/* Kredit pembuat di ujung kanan footer, sama dengan Bengkel PDF; di layar sempit turun ke baris sendiri. */
.kredit { font-weight: 600; color: var(--laut-tua); white-space: nowrap; }
.kredit-hati { width: 14px; height: 14px; vertical-align: -2px; fill: #c8423b; }

@media (max-width: 920px) {
  .panel-dalam { padding: 26px var(--tepi) 24px; gap: 18px; }
  .panel-judul { padding-top: 6px; }
  .kelompok { flex-direction: row; flex-wrap: wrap; gap: 8px; margin: 0; }
  .kelompok a { min-height: 44px; padding: 6px 8px 6px 14px; border-radius: 999px; }
  .kelompok a[aria-current="true"] { box-shadow: inset 0 0 0 1px var(--emas-terang); }
  .panel-deskripsi { font-size: 14px; line-height: 1.55; }
  .panel-dalam { padding-bottom: 92px; }
  .panel-keterangan { display: none; }
  .panel-foto { height: 120px; }
  /* Di layar sempit menu kelompok menimpa bagian atas foto, jadi peralihannya dimulai sedikit lebih rendah. */
  .panel-tabir {
    height: 170px;
    background:
      linear-gradient(to bottom, rgba(var(--rgb-gelap),0) 60%, rgba(var(--rgb-gelap),.35) 100%),
      linear-gradient(to bottom,
        rgb(var(--rgb-laut)) 15%, rgba(var(--rgb-laut),.998) 18.7%, rgba(var(--rgb-laut),.984) 22.4%,
        rgba(var(--rgb-laut),.951) 26.1%, rgba(var(--rgb-laut),.896) 29.8%, rgba(var(--rgb-laut),.820) 33.4%,
        rgba(var(--rgb-laut),.725) 37.1%, rgba(var(--rgb-laut),.616) 40.8%, rgba(var(--rgb-laut),.500) 44.5%,
        rgba(var(--rgb-laut),.384) 48.2%, rgba(var(--rgb-laut),.275) 51.9%, rgba(var(--rgb-laut),.180) 55.6%,
        rgba(var(--rgb-laut),.104) 59.2%, rgba(var(--rgb-laut),.049) 62.9%, rgba(var(--rgb-laut),.016) 66.6%,
        rgba(var(--rgb-laut),.002) 70.3%, rgba(var(--rgb-laut),0) 74%);
  }
}
@media (max-width: 560px) {
  h1 { font-size: 26px; }
  .panel-dalam { gap: 14px; padding-top: 22px; }
  h1 span { font-size: 20px; }
  .baris { grid-template-columns: 34px minmax(0, 1fr); padding: 13px 16px; }
  .buka { display: none; }
}
@media (max-width: 420px) {
  .kabar.bergeser .info .label { padding-right: 0; }
  .kabar.bergeser .info { padding-top: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .panel-foto, .baris, .kelompok a, .kabar-jalur, .titik::before { transition: none; }
}
</style>
</head>
<body>
<div class="halaman">
  <aside class="panel">
   <div class="panel-dalam">
    <div class="panel-foto" id="bannerFoto" role="img" aria-label=""></div>
    <div class="panel-tabir" aria-hidden="true"></div>

    <a class="merek" href="#konten">Subbagian Umum<small>KPKNL BALIKPAPAN</small></a>

    <div class="panel-judul">
      <p class="label" id="isiLabel"></p>
      <h1><span id="isiJudul" class="judul-utama"></span> <span id="isiSubjudul"></span></h1>
      <p class="panel-deskripsi" id="isiDeskripsi"></p>
    </div>

    <nav class="kelompok" id="menuKelompok" aria-label="Kelompok layanan"></nav>

    <p class="panel-keterangan">
      <span><span id="isiKetAtas"></span> <u aria-hidden="true"></u></span>
      <span id="isiKetBawah"></span>
    </p>
   </div>
  </aside>

  <main id="konten" class="isi">
    <p class="pratinjau" id="tandaPratinjau" hidden>Pratinjau dari dasbor admin. Isi ini belum diterbitkan.</p>
    <div class="alat">
      <form class="cari" role="search" id="formCari">
        <label for="cariLayanan" class="sr-only">Cari layanan Subbagian Umum</label>
        <svg class="cari-ikon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="cariLayanan" name="q" autocomplete="off" placeholder="Contoh: perjadin, rekening, SKTJM">
        <button type="button" class="hapus" id="hapusCari" aria-label="Hapus pencarian" title="Hapus pencarian" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </form>
      <a class="gerbang" id="tombolGerbang" href="#" target="_blank" rel="noopener" hidden></a>
      <button type="button" class="saklar-tema" data-tombol-mode aria-pressed="false" aria-label="Ganti ke tampilan gelap" title="Tampilan gelap">
        <svg class="ikon-bulan" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="ikon-matahari" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <p class="sr-only" id="jumlahLayanan" role="status" aria-live="polite"></p>

    <!-- KOTAK INFORMASI: isinya diatur dari dasbor admin, tab Informasi. -->
    <div class="kabar" id="kabar" role="region" aria-roledescription="carousel" aria-label="Informasi terkait" hidden>
      <div class="kabar-jendela" id="kabarJendela">
        <div class="kabar-jalur" id="kabarJalur"></div>
      </div>
      <div class="kabar-kendali" id="kabarKendali" hidden>
        <button type="button" class="jeda" id="kabarJeda" aria-pressed="false">Jeda</button>
      </div>
    </div>

    <!-- BAGIAN LAYANAN: kelompok dan tautannya diatur dari dasbor admin, tab Kelompok dan Tautan. -->
    <div id="daftarBagian" class="daftar-bagian"></div>

    <p class="kosong" id="layananKosong" hidden>Tidak ada layanan yang cocok. Coba kata kunci lain.</p>

    <footer class="kaki">
      <span id="isiKaki"></span>
      <span class="kredit">Dibuat dengan Claude dan GPT <svg class="kredit-hati" viewBox="0 0 24 24" width="14" height="14" role="img" aria-label="cinta"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.6 1.1 4.6 2.6l1 1.4 1-1.4C14 6.1 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg></span>
    </footer>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     ISI BERANDA
     Urutan sumber: pratinjau dari dasbor (bila alamat diakhiri ?pratinjau=1),
     lalu simpanan terakhir di peramban ini, lalu KONTEN_BAWAAN di konten.js.
     Setelah halaman tampil, isi terbaru diambil dari Apps Script (ALAMAT_SKRIP).
     Bila berbeda dengan yang tampil, beranda digambar ulang dan disimpan untuk kunjungan berikutnya.
     ============================================================ */
  var KUNCI_SIMPAN = "layanan-konten";
  var KUNCI_PRATINJAU = "layanan-pratinjau";
  var K = window.Konten;
  var pratinjau = /[?&]pratinjau=1\b/.test(location.search);

  function baca(kunci) { try { var t = localStorage.getItem(kunci); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
  function tulis(kunci, isi) { try { localStorage.setItem(kunci, JSON.stringify(isi)); } catch (e) { /* abaikan */ } }

  var sumber = (pratinjau && baca(KUNCI_PRATINJAU)) || baca(KUNCI_SIMPAN) || window.KONTEN_BAWAAN;
  var konten = K.rapikan(sumber);
  var jejak = JSON.stringify(konten);

  function $(id) { return document.getElementById(id); }
  function el(tag, kelas) { var n = document.createElement(tag); if (kelas) n.className = kelas; return n; }
  // Panah hanya hiasan, jadi disembunyikan dari pembaca layar.
  function panah(t) { var n = el("span"); n.setAttribute("aria-hidden", "true"); n.textContent = t; return n; }
  function tabBaru() { var n = el("span", "sr-only"); n.textContent = " (membuka tab baru)"; return n; }

  /* ---------- Teks panel, tombol Gerbang, dan kaki ---------- */
  function gambarUmum() {
    var u = konten.umum;
    $("isiLabel").textContent = u.label;
    K.isiTeks($("isiJudul"), u.judul);
    K.isiTeks($("isiSubjudul"), u.subjudul);
    $("isiSubjudul").hidden = !u.subjudul;
    K.isiTeks($("isiDeskripsi"), u.deskripsi);
    $("isiKetAtas").textContent = u.keteranganAtas;
    K.isiTeks($("isiKetBawah"), u.keteranganBawah);
    K.isiTeks($("isiKaki"), u.kaki);
    var g = $("tombolGerbang"), alamat = K.alamatAman(u.gerbang.alamat);
    g.hidden = !(u.gerbang.tampil && alamat && u.gerbang.teks);
    g.href = alamat || "#";
    g.textContent = u.gerbang.teks + " ";
    g.appendChild(panah("↗"));
    g.appendChild(tabBaru());
    $("tandaPratinjau").hidden = !pratinjau;
  }

  /* ---------- Menu kelompok dan bagian layanan ----------
     Nomor tautan berurutan di semua bagian, angka di menu kelompok dihitung sendiri. */
  function gambarLayanan() {
    var kelompok = konten.kelompok.filter(function (k) { return k.tampil !== false; });
    var tautan = konten.tautan.filter(function (t) { return t.tampil !== false && K.alamatAman(t.alamat); });
    var menu = $("menuKelompok"), wadah = $("daftarBagian"), nomor = 0;
    menu.textContent = ""; wadah.textContent = "";
    kelompok.forEach(function (k) {
      var isi = tautan.filter(function (t) { return t.kelompok === k.id; });
      if (!isi.length) return;
      var a = el("a"); a.href = "#" + k.id;
      a.appendChild(document.createTextNode(K.polos(k.nama) + " "));
      var b = el("b"); b.textContent = isi.length; a.appendChild(b);
      menu.appendChild(a);

      var s = el("section", "bagian" + (k.arsip ? " arsip" : ""));
      s.id = k.id; s.setAttribute("aria-labelledby", "j-" + k.id);
      var h = el("h2"); h.id = "j-" + k.id; K.isiTeks(h, k.judulBagian || k.nama); s.appendChild(h);
      var d = el("div", "daftar");
      isi.forEach(function (t) {
        nomor += 1;
        var alamat = K.alamatAman(t.alamat);
        var r = el("a", "baris"); r.href = alamat;
        var luar = K.luar(alamat);
        if (luar) { r.target = "_blank"; r.rel = "noopener"; }
        r.dataset.cari = K.polos(k.nama) + " " + (t.kunci || "");
        var n = el("span", "nomor"); n.textContent = (nomor < 10 ? "0" : "") + nomor;
        var u = el("span", "uraian"), j = el("strong"), ket = el("span");
        K.isiTeks(j, t.judul); K.isiTeks(ket, t.uraian);
        if (luar) j.appendChild(tabBaru());
        u.appendChild(j); if (t.uraian) u.appendChild(ket);
        var buka = el("span", "buka"); buka.textContent = "Buka "; buka.appendChild(panah(luar ? "↗" : "→"));
        r.appendChild(n); r.appendChild(u); r.appendChild(buka);
        d.appendChild(r);
      });
      s.appendChild(d);
      wadah.appendChild(s);
    });
  }

  /* ---------- Banner berganti ----------
     Pergantian mengikuti jam perangkat, jadi semua pegawai melihat banner yang sama pada waktu yang sama.
     Banner malam dipakai di mode gelap. Berkas banner boleh nama berkas di repo ini atau alamat https. */
  var foto = $("bannerFoto"), terpasang = "", pewaktuBanner = null;
  function daftarAktif() {
    var b = konten.banner, gelap = document.documentElement.getAttribute("data-mode") === "gelap";
    var pilih = function (d) { return (d || []).filter(function (x) { return x.tampil !== false && K.alamatAman(x.berkas); }); };
    var d = pilih(gelap ? b.malam : b.siang);
    return d.length ? d : pilih(gelap ? b.siang : b.malam);
  }
  function jeda() { return Math.max(1, Number(konten.banner.menit) || 10) * 60000; }
  function waktuSetempat(kini) { return kini.getTime() - kini.getTimezoneOffset() * 60000; }
  function nomorBanner(kini, jumlah) { return Math.floor(waktuSetempat(kini) / jeda()) % jumlah; }
  function sisaWaktu(kini) { return jeda() - (waktuSetempat(kini) % jeda()); }
  function pasangBanner() {
    var daftar = daftarAktif();
    if (!daftar.length) { foto.style.backgroundImage = "none"; terpasang = ""; return; }
    var banner = daftar[nomorBanner(new Date(), daftar.length)];
    var berkas = K.alamatAman(banner.berkas), kunci = berkas + "|" + banner.posisi;
    if (kunci === terpasang) return;
    function tampil() {
      foto.style.backgroundImage = 'url("' + berkas.replace(/"/g, "%22") + '")';
      foto.style.backgroundPosition = (Number(banner.posisi) || 50) + "% center";
      foto.setAttribute("aria-label", banner.uraian || "");
      foto.classList.remove("memudar");
      terpasang = kunci;
    }
    if (terpasang === "") { tampil(); return; }
    // Halaman yang dibiarkan terbuka: muat dulu gambarnya, lalu ganti dengan pudaran singkat.
    var muat = new Image();
    muat.onload = muat.onerror = function () { foto.classList.add("memudar"); setTimeout(tampil, 500); };
    muat.src = berkas;
  }
  function jadwalkan() {
    clearTimeout(pewaktuBanner);
    pewaktuBanner = setTimeout(function () { pasangBanner(); jadwalkan(); }, sisaWaktu(new Date()) + 1000);
  }
  document.addEventListener("modeberubah", pasangBanner);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pasangBanner(); });

  /* ---------- Pencarian ---------- */
  var form = $("formCari"), input = $("cariLayanan"), status = $("jumlahLayanan"), kosong = $("layananKosong");
  function cari() {
    var baris = Array.prototype.slice.call(document.querySelectorAll(".baris"));
    var kata = input.value.trim().toLocaleLowerCase("id");
    var terlihat = 0;
    baris.forEach(function (b) {
      var teks = (b.textContent + " " + b.dataset.cari).toLocaleLowerCase("id");
      var cocok = !kata || teks.indexOf(kata) !== -1;
      b.hidden = !cocok;
      if (cocok) terlihat++;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".bagian"), function (s) {
      var tampak = s.querySelectorAll(".baris:not([hidden])");
      s.hidden = tampak.length === 0;
      // Baris pertama yang tampak tidak diberi garis atas.
      Array.prototype.forEach.call(s.querySelectorAll(".baris"), function (b) { b.classList.remove("pertama"); });
      if (tampak.length) tampak[0].classList.add("pertama");
    });
    status.textContent = kata ? terlihat + " dari " + baris.length + " layanan cocok" : baris.length + " layanan tersedia";
    kosong.hidden = terlihat > 0;
  }
  var hapus = $("hapusCari");
  function segarkan() { hapus.hidden = !input.value; cari(); }
  form.addEventListener("submit", function (e) { e.preventDefault(); segarkan(); });
  input.addEventListener("input", segarkan);
  input.addEventListener("keydown", function (e) { if (e.key === "Escape" && input.value) { input.value = ""; segarkan(); } });
  hapus.addEventListener("click", function () { input.value = ""; segarkan(); input.focus(); });

  /* ---------- Menu kelompok: gulir ke bagian yang dipilih ---------- */
  var halus = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest(".kelompok a, .merek");
    if (!a) return;
    var tujuan = document.getElementById(a.getAttribute("href").slice(1));
    if (!tujuan) return;
    e.preventDefault();
    if (input.value) { input.value = ""; segarkan(); }
    if (a.closest(".kelompok")) kunciSorotan(tujuan.id, tandaiAktif);
    tujuan.scrollIntoView({ behavior: halus ? "smooth" : "auto", block: "start" });
  });

  /* ---------- Penanda bagian aktif pada menu kelompok ---------- */
  /* Bagian aktif dihitung dari posisi gulir: bagian terakhir yang judulnya sudah melewati sepertiga atas layar.
     Bagian pendek di ujung halaman yang tidak pernah bisa naik sampai sepertiga atas mendapat giliran
     pada sisa jarak gulir, jadi saat halaman mentok di bawah, bagian terakhirlah yang tersorot.
     Menu yang diklik langsung disorot dan dipertahankan sampai guliran halus selesai, jadi sorotan tidak
     melompat ke bagian lain ketika tujuan tidak bisa digulir sampai ke atas. */
  function bagianAktif(daftar) {
    if (!daftar.length) return null;
    // Titik gulir tempat tiap bagian mulai aktif: saat judulnya tiba di sepertiga atas layar.
    var y = window.scrollY, batas = window.innerHeight / 3;
    var maks = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    var titik = daftar.map(function (b) { return b.getBoundingClientRect().top + y - batas; });
    // Bagian di ujung halaman yang titiknya melewati batas gulir dibagi rata pada sisa jarak gulir,
    // jadi sorotan tetap berpindah satu per satu walau halaman sudah hampir mentok.
    var k = titik.findIndex(function (t) { return t > maks; });
    if (k > 0) {
      var mulai = Math.min(titik[k - 1], maks), sisa = titik.length - k;
      for (var i = k; i < titik.length; i++) titik[i] = mulai + (maks - mulai) * (i - k + 1) / sisa;
    }
    var aktif = daftar[0];
    titik.forEach(function (t, i) { if (y >= t - 1) aktif = daftar[i]; });
    return aktif;
  }
  var kunciKlik = null, pewaktuKlik = null;
  function kunciSorotan(id, tandai) {
    kunciKlik = id; tandai(id);
    clearTimeout(pewaktuKlik);
    pewaktuKlik = setTimeout(function () { kunciKlik = null; }, 1200);
  }
  function tandaiAktif(id) {
    Array.prototype.forEach.call(document.querySelectorAll(".kelompok a"), function (a) {
      if (a.getAttribute("href") === "#" + id) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current");
    });
  }
  function hitungAktif() {
    if (kunciKlik) return;
    var daftar = Array.prototype.filter.call(document.querySelectorAll(".bagian"), function (b) { return !b.hidden && b.offsetParent !== null; });
    var b = bagianAktif(daftar);
    if (b) tandaiAktif(b.id);
  }
  var antreGulir = false;
  window.addEventListener("scroll", function () {
    // Selama guliran dari klik masih berjalan, kunci diperpanjang sampai guliran berhenti.
    if (kunciKlik) { clearTimeout(pewaktuKlik); pewaktuKlik = setTimeout(function () { kunciKlik = null; }, 200); return; }
    if (antreGulir) return;
    antreGulir = true;
    requestAnimationFrame(function () { antreGulir = false; hitungAktif(); });
  }, { passive: true });
  window.addEventListener("resize", hitungAktif);
  function amatiBagian() { hitungAktif(); }

  /* ---------- Kotak informasi bergeser dari bawah ke atas ----------
     Pergeseran berhenti sementara saat kotak disorot tetikus atau difokus papan ketik, dan bisa dihentikan lewat tombol Jeda. */
  var kabar = $("kabar"), jendela = $("kabarJendela"), jalur = $("kabarJalur");
  var kendali = $("kabarKendali"), tombolJeda = $("kabarJeda");
  var animasi = halus;
  var sk = { info: [], semua: [], titik: [], aktif: 0, tinggi: 0, pewaktu: null, dijeda: false, disorot: false };

  function ukur() {
    if (sk.info.length < 2) return;
    sk.semua.forEach(function (n) { n.style.height = "auto"; });
    sk.tinggi = Math.max.apply(null, sk.info.map(function (n) { return n.offsetHeight; }));
    sk.semua.forEach(function (n) { n.style.height = sk.tinggi + "px"; });
    jendela.style.height = sk.tinggi + "px";
    geser(false);
  }
  function geser(halusGeser) {
    jalur.style.transition = halusGeser && animasi ? "" : "none";
    jalur.style.transform = "translateY(" + (-sk.aktif * sk.tinggi) + "px)";
    var tampak = sk.aktif % sk.info.length;
    sk.titik.forEach(function (t, i) { t.setAttribute("aria-current", String(i === tampak)); });
    sk.info.forEach(function (n, i) { n.setAttribute("aria-hidden", String(i !== tampak)); });
  }
  function maju() {
    if (sk.aktif >= sk.info.length) return;
    sk.aktif += 1;
    geser(true);
    if (sk.aktif === sk.info.length && !animasi) { sk.aktif = 0; geser(false); }
  }
  function mulai() {
    clearInterval(sk.pewaktu);
    var detik = Math.max(3, Number(konten.umum.detikPerInfo) || 7);
    if (sk.info.length > 1 && !sk.dijeda && !sk.disorot) sk.pewaktu = setInterval(maju, detik * 1000);
  }
  jalur.addEventListener("transitionend", function (e) {
    if (e.target === jalur && sk.aktif === sk.info.length) { sk.aktif = 0; geser(false); }
  });
  kabar.addEventListener("mouseenter", function () { sk.disorot = true; mulai(); });
  kabar.addEventListener("mouseleave", function () { sk.disorot = false; mulai(); });
  kabar.addEventListener("focusin", function () { sk.disorot = true; mulai(); });
  kabar.addEventListener("focusout", function (e) { if (!kabar.contains(e.relatedTarget)) { sk.disorot = false; mulai(); } });
  tombolJeda.addEventListener("click", function () {
    sk.dijeda = !sk.dijeda;
    tombolJeda.setAttribute("aria-pressed", String(sk.dijeda));
    tombolJeda.textContent = sk.dijeda ? "Lanjut" : "Jeda";
    mulai();
  });
  window.addEventListener("resize", ukur);

  function gambarInfo() {
    clearInterval(sk.pewaktu);
    jalur.textContent = "";
    Array.prototype.forEach.call(kendali.querySelectorAll(".titik"), function (t) { t.remove(); });
    jendela.style.height = ""; jalur.style.transform = "";
    sk.aktif = 0;
    var daftar = konten.info.filter(function (x) { return x.tampil !== false && (x.judul || x.isi); });
    sk.info = daftar.map(function (x) {
      var a = el("article", "info");
      if (x.label) { var l = el("p", "label"); l.textContent = x.label; a.appendChild(l); }
      if (x.judul) a.appendChild(K.isiTeks(el("strong"), x.judul));
      if (x.isi) a.appendChild(K.isiTeks(el("p"), x.isi));
      jalur.appendChild(a);
      return a;
    });
    kabar.hidden = !sk.info.length;
    kabar.classList.toggle("bergeser", sk.info.length > 1);
    kendali.hidden = sk.info.length < 2;
    if (sk.info.length < 2) { sk.semua = sk.info; sk.titik = []; return; }
    // Salinan informasi pertama di ujung jalur, supaya pergeseran dari informasi terakhir ke pertama tetap ke atas.
    var salinan = sk.info[0].cloneNode(true);
    salinan.setAttribute("aria-hidden", "true");
    jalur.appendChild(salinan);
    sk.semua = sk.info.concat([salinan]);
    sk.titik = sk.info.map(function (_, i) {
      var b = el("button", "titik"); b.type = "button";
      b.setAttribute("aria-label", "Tampilkan informasi " + (i + 1) + " dari " + sk.info.length);
      b.addEventListener("click", function () { sk.aktif = i; geser(true); mulai(); });
      kendali.insertBefore(b, tombolJeda);
      return b;
    });
    ukur();
    mulai();
  }

  /* ---------- Menggambar seluruh beranda ---------- */
  function gambar() {
    gambarUmum();
    gambarLayanan();
    gambarInfo();
    terpasang = "";
    pasangBanner();
    jadwalkan();
    cari();
    amatiBagian();
  }
  gambar();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ukur);

  /* ---------- Mengambil isi terbaru dari Apps Script ---------- */
  if (window.ALAMAT_SKRIP && !pratinjau && window.fetch) {
    fetch(window.ALAMAT_SKRIP + "?aksi=baca", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (hasil) {
        if (!hasil || !hasil.ok || !hasil.konten) return;
        var baru = K.rapikan(hasil.konten);
        tulis(KUNCI_SIMPAN, baru);
        if (JSON.stringify(baru) === jejak) return;
        konten = baru; jejak = JSON.stringify(baru);
        gambar();
      })
      .catch(function () { /* tetap memakai isi yang sudah tampil */ });
  }

  // Pratinjau ikut berubah selama dasbor admin terbuka di tab lain.
  if (pratinjau) {
    window.addEventListener("storage", function (e) {
      if (e.key !== KUNCI_PRATINJAU) return;
      var p = baca(KUNCI_PRATINJAU);
      if (p) { konten = K.rapikan(p); gambar(); }
    });
  }

  window.__banner = { nomorBanner: nomorBanner, sisaWaktu: sisaWaktu };
  window.__kabar = { maju: maju, keadaan: function () { return { aktif: sk.aktif, tinggi: sk.tinggi, dijeda: sk.dijeda }; } };
})();
</script>
</body>
</html>
